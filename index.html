function tryLogin(e) {
  if (e) e.preventDefault();
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value.trim();
  if (u === 'XLK2026' && p === 'XLK2026') {
    try {
      sessionStorage.setItem('cr-auth', '1');
      localStorage.setItem('cr-auth', '1');
    } catch (err) {}
    document.body.classList.remove('locked');
  } else {
    const err = document.getElementById('login-error');
    err.textContent = '用户名或密码错误 / Invalid credentials';
    document.getElementById('login-pass').value = '';
    document.getElementById('login-pass').focus();
  }
}

// ============================================================
let state = { lang: 'zh', route: 'landing', testId: null, current: 0, answers: {} };

// load saved language
try { const saved = localStorage.getItem('crossroads-lang'); if (saved) state.lang = saved; } catch (e) {}

const app = document.getElementById('app');

function setLang(lang) {
  state.lang = lang;
  try { localStorage.setItem('crossroads-lang', lang); } catch (e) {}
  document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
  updateNav();
  render();
}

function updateNav() {
  document.getElementById('brand-zh').style.display = state.lang === 'zh' ? '' : 'none';
  document.getElementById('brand-en').style.display = state.lang === 'en' ? '' : 'none';
  if (state.lang === 'en') {
    document.getElementById('brand-en').classList.remove('text-xs', 'text-[var(--muted)]');
    document.getElementById('brand-en').classList.add('font-display', 'text-lg');
    document.getElementById('brand-en').style.display = '';
  } else {
    document.getElementById('brand-en').classList.add('text-xs', 'text-[var(--muted)]');
    document.getElementById('brand-en').classList.remove('font-display', 'text-lg');
  }
  document.getElementById('nav-decisions').textContent = L(UI.navDecisions);
  document.getElementById('nav-how').textContent = L(UI.navHow);
  document.getElementById('nav-pricing').textContent = L(UI.navPricing);
  document.getElementById('nav-cta').textContent = L(UI.navCta);
  document.getElementById('lang-zh').classList.toggle('active', state.lang === 'zh');
  document.getElementById('lang-en').classList.toggle('active', state.lang === 'en');
}

function go(route, testId) {
  state.route = route;
  if (testId !== undefined) state.testId = testId;
  if (route === 'intro' || route === 'quiz') { state.current = 0; state.answers = {}; }
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

function scrollToId(id) {
  if (state.route !== 'landing') {
    go('landing');
    setTimeout(() => { document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' }); }, 300);
  } else {
    document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
  }
}

function render() {
  updateNav();
  if (state.route === 'landing') return renderLanding();
  if (state.route === 'intro') return renderIntro();
  if (state.route === 'quiz') return renderQuiz();
  if (state.route === 'result') return renderResult();
}

function renderIntro() {
  const t = tests[state.testId];
  const c = colorMap[t.color];
  app.innerHTML = `
    <div class="max-w-2xl mx-auto px-5 md:px-8 py-12 md:py-20 fade-in">
      <button onclick="go('landing')" class="mb-8 inline-flex items-center gap-2 text-sm text-[var(--muted)] hover:text-[var(--ink)] transition">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>${L(UI.back)}
      </button>
      <div class="inline-block px-3 py-1.5 rounded-full mb-6 text-xs tracking-wider" style="background: ${c.bg}; color: ${c.text};">${L(t.pathA)} vs ${L(t.pathB)}</div>
      <h1 class="font-display-heavy text-4xl md:text-5xl leading-tight mb-5">${L(t.title)}</h1>
      <p class="text-xl text-[var(--muted)] leading-relaxed mb-8">${L(t.subtitle)}</p>
      <div class="card p-5 mb-8 text-sm leading-relaxed" style="background: ${c.soft}; border-color: ${c.border}; color: ${c.text};">
        <strong>${L(UI.introHeadsUp)}</strong> ${L(t.caveat)}
      </div>
      <div class="card p-6 mb-10">
        <div class="grid grid-cols-3 gap-4 text-center">
          <div><div class="font-display text-3xl">${t.questions.length}</div><div class="text-xs text-[var(--muted)] mt-1 tracking-wider">${L(UI.introQ)}</div></div>
          <div class="border-x border-[var(--line)]"><div class="font-display text-3xl">5</div><div class="text-xs text-[var(--muted)] mt-1 tracking-wider">${L(UI.introMin)}</div></div>
          <div><div class="font-display text-3xl">2</div><div class="text-xs text-[var(--muted)] mt-1 tracking-wider">${L(UI.introPaths)}</div></div>
        </div>
      </div>
      <button onclick="go('quiz', '${t.id}')" class="btn-primary">${L(UI.introStart)}
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  `;
}

// ============================================================
// QUIZ
// ============================================================
function renderQuiz() {
  const t = tests[state.testId];
  const c = colorMap[t.color];
  const q = t.questions[state.current];
  const total = t.questions.length;
  const progress = (state.current / total) * 100;
  const selected = state.answers[state.current];

  app.innerHTML = `
    <div class="max-w-2xl mx-auto px-5 md:px-8 py-10 md:py-16 fade-in">
      <button onclick="go('landing')" class="mb-8 inline-flex items-center gap-2 text-sm text-[var(--muted)] hover:text-[var(--ink)] transition">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>${L(UI.back)}
      </button>
      <div class="mb-10">
        <div class="flex justify-between items-center text-xs text-[var(--muted)] mb-3">
          <span class="tracking-wider">${L(t.title)} · ${L(UI.quizQ)} ${state.current + 1} ${L(UI.quizOf)} ${total}</span>
          <span class="font-display">${Math.round(progress)}%</span>
        </div>
        <div class="h-1 bg-[var(--line)] rounded-full overflow-hidden"><div class="progress-bar h-full rounded-full" style="width: ${progress}%; background: ${c.main};"></div></div>
      </div>
      <h2 class="font-display text-2xl md:text-3xl leading-snug mb-8">${L(q.q)}</h2>
      <div class="space-y-3 mb-10">
        ${q.opts.map((opt) => `<button onclick="pickOption(${opt[1]})" class="option-btn ${selected !== undefined && selected === opt[1] ? 'selected' : ''}"><span class="dot"></span><span>${L(opt[0])}</span></button>`).join('')}
      </div>
      <div class="flex justify-between items-center">
        <button onclick="prevQ()" class="inline-flex items-center gap-2 text-sm text-[var(--muted)] hover:text-[var(--ink)] transition ${state.current === 0 ? 'invisible' : ''}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 18l-6-6 6-6M5 12h14"/></svg>${L(UI.quizPrev)}
        </button>
        ${selected !== undefined ? `<button onclick="nextQ()" class="btn-primary">${state.current === total - 1 ? L(UI.quizFinish) : L(UI.quizNext)}
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>` : '<div></div>'}
      </div>
    </div>
  `;
}

function pickOption(score) { state.answers[state.current] = score; render(); }
function nextQ() { const t = tests[state.testId]; if (state.current < t.questions.length - 1) { state.current++; render(); } else { state.route = 'result'; window.scrollTo({ top: 0, behavior: 'smooth' }); render(); } }
function prevQ() { if (state.current > 0) { state.current--; render(); } }

// ============================================================
// RESULT
// ============================================================
function renderResult() {
  const t = tests[state.testId];
  const c = colorMap[t.color];
  const total = Object.values(state.answers).reduce((a, b) => a + b, 0);
  const profile = t.profiles.find(p => total >= p.min) || t.profiles[t.profiles.length - 1];
  const maxScore = t.questions.length * 2;
  const overallPct = ((total + maxScore) / (maxScore * 2)) * 100;
  const leanA = total > 2; const leanB = total < -2;
  const ranked = Object.entries(state.answers).map(([idx, score]) => ({ idx: parseInt(idx), score, abs: Math.abs(score) })).sort((a, b) => b.abs - a.abs);
  const topTilts = ranked.filter(r => r.abs >= 1).slice(0, 3);

  app.innerHTML = `
    <div class="max-w-3xl mx-auto px-5 md:px-8 py-10 md:py-16 fade-in">
      <button onclick="go('landing')" class="mb-8 inline-flex items-center gap-2 text-sm text-[var(--muted)] hover:text-[var(--ink)] transition">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>${L(UI.back)}
      </button>
      <div class="inline-block px-3 py-1.5 rounded-full mb-4 text-xs tracking-wider" style="background: ${c.bg}; color: ${c.text};">${L(profile.tag)}</div>
      <h1 class="font-display-heavy text-3xl md:text-5xl leading-tight mb-4">${L(profile.headline)}</h1>
      <p class="text-lg text-[var(--muted)] leading-relaxed mb-10">${L(profile.desc)}</p>

      <div class="card p-6 md:p-7 mb-5">
        <div class="flex justify-between text-xs text-[var(--muted)] mb-3 tracking-wider">
          <span>${L(UI.resLeanLow)} ${L(t.pathB)}</span><span>${L(UI.resLeanMid)}</span><span>${L(UI.resLeanLow)} ${L(t.pathA)}</span>
        </div>
        <div class="relative h-3 rounded-full" style="background: linear-gradient(to right, #e8e1d4 0%, #f5f1e8 50%, ${c.bg} 100%);">
          <div class="absolute top-1/2 -translate-y-1/2 w-5 h-5 rounded-full pulse-dot" style="background: var(--ink); border: 2.5px solid white; left: calc(${overallPct}% - 10px);"></div>
        </div>
        <div class="flex justify-between items-center mt-4">
          <div class="text-xs text-[var(--muted)]">${L(UI.resYourScore)}</div>
          <div class="font-display text-2xl" style="color: ${c.main};">${total > 0 ? '+' : ''}${total} <span class="text-sm text-[var(--muted)] font-normal">/ ±${maxScore}</span></div>
        </div>
      </div>

      <div class="card p-6 md:p-7 mb-5">
        <div class="mb-5"><h3 class="font-display text-xl mb-1">${L(UI.resTrajTitle)}</h3><p class="text-xs text-[var(--muted)]">${L(UI.resTrajSub)}</p></div>
        <div class="grid md:grid-cols-2 gap-4">
          <div class="rounded-2xl p-5" style="background: ${leanA ? c.bg : '#f8f5ef'}; border: 1px solid ${leanA ? c.border : 'var(--line)'};">
            <div class="flex items-center justify-between mb-4">
              <div class="text-sm font-bold tracking-wider" style="color: ${leanA ? c.text : 'var(--muted)'};">${L(t.pathA)}</div>
              ${leanA ? `<div class="text-xs px-2 py-0.5 rounded-full" style="background: ${c.main}; color: white;">${L(UI.resYourDir)}</div>` : ''}
            </div>
            <div class="space-y-3 text-sm leading-relaxed">
              <div><span class="font-display text-xs" style="color: ${leanA ? c.text : 'var(--muted)'};">${L(UI.resYr1)}</span><br/>${L(t.trajectory.A.y1)}</div>
              <div><span class="font-display text-xs" style="color: ${leanA ? c.text : 'var(--muted)'};">${L(UI.resYr3)}</span><br/>${L(t.trajectory.A.y3)}</div>
              <div><span class="font-display text-xs" style="color: ${leanA ? c.text : 'var(--muted)'};">${L(UI.resYr5)}</span><br/>${L(t.trajectory.A.y5)}</div>
            </div>
          </div>
          <div class="rounded-2xl p-5" style="background: ${leanB ? c.bg : '#f8f5ef'}; border: 1px solid ${leanB ? c.border : 'var(--line)'};">
            <div class="flex items-center justify-between mb-4">
              <div class="text-sm font-bold tracking-wider" style="color: ${leanB ? c.text : 'var(--muted)'};">${L(t.pathB)}</div>
              ${leanB ? `<div class="text-xs px-2 py-0.5 rounded-full" style="background: ${c.main}; color: white;">${L(UI.resYourDir)}</div>` : ''}
            </div>
            <div class="space-y-3 text-sm leading-relaxed">
              <div><span class="font-display text-xs" style="color: ${leanB ? c.text : 'var(--muted)'};">${L(UI.resYr1)}</span><br/>${L(t.trajectory.B.y1)}</div>
              <div><span class="font-display text-xs" style="color: ${leanB ? c.text : 'var(--muted)'};">${L(UI.resYr3)}</span><br/>${L(t.trajectory.B.y3)}</div>
              <div><span class="font-display text-xs" style="color: ${leanB ? c.text : 'var(--muted)'};">${L(UI.resYr5)}</span><br/>${L(t.trajectory.B.y5)}</div>
            </div>
          </div>
        </div>
      </div>

      ${topTilts.length > 0 ? `
      <div class="card p-6 md:p-7 mb-5">
        <h3 class="font-display text-xl mb-5">${L(UI.resTopTilts)}</h3>
        <ol class="space-y-4">
          ${topTilts.map((r) => {
            const q = t.questions[r.idx];
            const opt = q.opts.find(o => o[1] === r.score);
            const direction = r.score > 0 ? `${L(UI.resTilt)} ${L(t.pathA)}` : `${L(UI.resTilt)} ${L(t.pathB)}`;
            return `<li class="border-l-2 pl-4" style="border-color: ${c.main};">
              <div class="text-xs text-[var(--muted)] mb-1.5">${L(q.q)}</div>
              <div class="flex items-center justify-between gap-3 flex-wrap">
                <span class="font-medium text-sm">${L(opt[0])}</span>
                <span class="text-xs px-2 py-1 rounded-full" style="background: ${c.bg}; color: ${c.text};">${direction}</span>
              </div>
            </li>`;
          }).join('')}
        </ol>
      </div>` : ''}

      <div class="rounded-3xl p-6 md:p-8 mb-5" style="background: var(--ink); color: var(--cream);">
        <div class="text-xs tracking-wider mb-4" style="color: ${c.soft};">${L(UI.resNextTitle)}</div>
        <ol class="space-y-4">
          ${profile.steps.map((s, i) => `<li class="flex gap-4">
            <span class="flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-sm font-display" style="background: ${c.main}; color: white;">${i + 1}</span>
            <span class="text-sm leading-relaxed pt-1">${L(s)}</span>
          </li>`).join('')}
        </ol>
      </div>

      <div class="card p-6 md:p-7 mb-5" style="background: linear-gradient(135deg, ${c.soft} 0%, var(--cream) 100%); border-color: ${c.border};">
        <div class="text-xs tracking-wider mb-3" style="color: ${c.text};">${L(UI.resUpsellEyebrow)}</div>
        <h3 class="font-display text-xl mb-2">${L(UI.resUpsellTitle)}</h3>
        <p class="text-sm text-[var(--muted)] leading-relaxed mb-5">${L(UI.resUpsellDesc)}</p>
        <button class="btn-primary">${L(UI.resUpsellCta)}</button>
      </div>

      <!-- Feedback ask: route to Tally form -->
      <div class="card p-6 md:p-7 mb-5" style="background: #fef9e7; border-color: #fcd34d;">
        <div class="flex items-start gap-4">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <div class="flex-1">
            <h3 class="font-display text-lg mb-2">${state.lang === 'en' ? 'Got 30 minutes to help shape this?' : '愿意花 30 分钟帮我把这个工具做得更好吗？'}</h3>
            <p class="text-sm text-[var(--muted)] leading-relaxed mb-4">${state.lang === 'en' ? 'We\'re talking to early users right now. Your feedback directly shapes the next version. Quick Zoom or WeChat call.' : '我们正在和早期用户聊。你的反馈直接决定下一版长什么样。约个 Zoom 或微信视频，半小时就好。'}</p>
            <a href="https://tally.so/r/YOUR_TALLY_FORM_ID" target="_blank" rel="noopener" class="btn-primary" style="text-decoration: none; font-size: 14px; padding: 10px 20px;">${state.lang === 'en' ? 'Book a chat →' : '填表预约 →'}</a>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap gap-3">
        <button onclick="go('quiz', '${t.id}')" class="btn-secondary">${L(UI.resRetake)}</button>
        <button onclick="go('landing')" class="btn-secondary">${L(UI.resOther)}</button>
        <button onclick="window.print()" class="btn-secondary">${L(UI.resPrint)}</button>
      </div>

      <div class="card p-5 mt-8 text-sm text-[var(--muted)] leading-relaxed" style="background: #faf7f2; border-style: dashed;">
        <strong class="text-[var(--ink)]">${L(UI.resRemindersTitle)}</strong> ${L(UI.resReminders)}
      </div>
    </div>
  `;
}

render();
</script>
</body>
</html>
